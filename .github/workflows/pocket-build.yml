name: Pocket Build

on:
  push:
    branches: [analogue]
    paths-ignore: ['**.md']
  pull_request:
    branches: [analogue]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  synthesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        run: |
          docker run --rm -v "$PWD":/build -w /build/pocket/src/fpga \
            ghcr.io/raetro/quartus:pocket \
            quartus_sh --flow compile ap_core.qpf

      - name: Fix output ownership
        run: sudo chown -R "$(id -u):$(id -g)" pocket/src/fpga/output_files

      - name: Print fit summary
        working-directory: pocket/src/fpga
        run: |
          report=output_files/ap_core.fit.rpt
          test -f "$report" || { echo "no fit report produced"; exit 1; }
          if grep -qE "Logic utilization|ALMs|registers|block memory bits|RAM Blocks|^Device|^Family" "$report"; then
            grep -E "Logic utilization|ALMs|registers|block memory bits|RAM Blocks|^Device|^Family" "$report"
          else
            echo "expected summary lines not found, printing first 60 lines instead:"
            sed -n '1,60p' "$report"
          fi

      - name: Check timing closure
        run: |
          python3 pocket/tools/check_timing.py \
            pocket/src/fpga/output_files/ap_core.sta.rpt

      - name: Reverse bitstream
        run: |
          python3 pocket/tools/reverse_rbf.py \
            pocket/src/fpga/output_files/ap_core.rbf \
            bitstream.rbf_r

      - name: Package core
        run: |
          mkdir -p package
          cp -R pocket/dist/* package/
          mkdir -p package/Assets/bosconian/common
          cp bitstream.rbf_r package/Cores/nlhomme.Bosconian/bitstream.rbf_r
          ( cd package && zip -r ../nlhomme.Bosconian.zip . )

      - name: Upload core package
        uses: actions/upload-artifact@v4
        with:
          name: pocket-core
          path: nlhomme.Bosconian.zip

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            pocket/src/fpga/output_files/ap_core.fit.rpt
            pocket/src/fpga/output_files/ap_core.sta.rpt
            pocket/src/fpga/output_files/ap_core.map.rpt
          if-no-files-found: ignore
